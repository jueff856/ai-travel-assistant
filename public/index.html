<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI旅行助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 640px;
      height: 100vh;
      max-height: 800px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 20px 24px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
    }

    .chat-header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .chat-header p {
      font-size: 13px;
      opacity: 0.85;
      margin-top: 4px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    .message {
      margin-bottom: 16px;
      display: flex;
      gap: 10px;
    }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .message.bot .avatar { background: #eef0ff; }
    .message.user .avatar { background: #f0f0f0; }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.bot .bubble {
      background: #f4f5f7;
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bubble a {
      color: #667eea;
      text-decoration: underline;
    }

    .message.user .bubble a { color: #c4b5fd; }

    .chat-input {
      padding: 16px 24px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input input:focus { border-color: #667eea; }

    .chat-input button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .chat-input button:hover { opacity: 0.9; }
    .chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }

    .typing {
      display: inline-block;
    }

    .typing span {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #999;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .typing span:nth-child(1) { animation-delay: 0s; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    .ask-options { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .ask-btn {
      background: #fff; border: 1px solid #ff6a00; color: #ff6a00;
      padding: 4px 12px; border-radius: 14px; cursor: pointer; font-size: 13px;
      transition: all 0.2s;
    }
    .ask-btn:hover { background: #ff6a00; color: #fff; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>AI旅行助手</h1>
      <p>酒店 · 机票 · 火车票 · 智能推荐</p>
    </div>

    <div class="chat-messages" id="messages">
      <div class="message bot">
        <div class="avatar">🤖</div>
        <div class="bubble">您好！我是AI旅行助手，可以帮您查询酒店、机票和火车票。\n试试说：\n• "帮我查杭州的酒店"\n• "北京机票多少钱"\n• "上海到杭州的高铁"</div>
      </div>
    </div>

    <div class="chat-input">
      <input type="text" id="input" placeholder="输入您的旅行需求..." autocomplete="off">
      <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </div>

  <script>
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
    const sendBtn = document.getElementById('sendBtn');

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage(overrideText) {
      const text = overrideText || input.value.trim();
      if (!text) return;

      // 用户消息（按钮触发时不重复添加）
      if (!overrideText) appendMessage('user', text);
      input.value = '';
      sendBtn.disabled = true;

      // 加载动画
      const typingEl = appendTyping();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        typingEl.remove();
        appendMessage('bot', data.reply, data.askBack);
      } catch {
        typingEl.remove();
        appendMessage('bot', '网络错误，请稍后重试');
      }

      sendBtn.disabled = false;
      input.focus();
    }

    function appendMessage(role, text, askBack) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      let bubbleContent;
      if (role === 'bot') {
        bubbleContent = escapeHtml(text);
        // 追问按钮
        if (askBack && askBack.options) {
          const btns = askBack.options.map(o =>
            `<button class="ask-btn" onclick="sendAsk(this)">${escapeHtml(o)}</button>`
          ).join(' ');
          bubbleContent += `<div class="ask-options">${btns}</div>`;
        }
      } else {
        bubbleContent = escapeHtml(text);
      }
      div.innerHTML = `
        <div class="avatar">${role === 'bot' ? '🤖' : '👤'}</div>
        <div class="bubble">${bubbleContent}</div>
      `;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function sendAsk(btn) {
      const text = btn.textContent;
      appendMessage('user', text);
      sendMessage(text);
    }

    function appendTyping() {
      const div = document.createElement('div');
      div.className = 'message bot';
      div.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>
      `;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
    }
  </script>
</body>
</html>
